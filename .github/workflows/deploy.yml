name: deploy

# Manual on purpose: UniBaazar is live, and the team is deliberately building
# the rest of the v2 rebuild locally/in CI before deploying anything for
# real (see docs/decisions/0007-manual-deploy-trigger.md). `ci` still runs
# and packages a release artifact on every push to main; this workflow picks
# a specific already-built, already-green artifact and ships it, only when
# someone explicitly runs it.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (must have a successful ci run on main)"
        required: true

jobs:
  find-ci-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=ci.yml \
            --json headSha,databaseId,conclusion,status \
            --jq "[.[] | select(.headSha==\"${{ inputs.sha }}\" and .status==\"completed\" and .conclusion==\"success\")][0].databaseId")
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful ci run found for ${{ inputs.sha }} — check the Actions tab." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy:
    needs: find-ci-run
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read # lets the host download the artifact built by ci.yml
      contents: read
    steps:
      - name: Ensure the release/shared directories exist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Optional: only needed if the key was generated with a
          # passphrase (some cPanel hosts' "Generate a New Key" form
          # requires one and won't let you leave it blank). Empty when
          # SSH_PASSPHRASE isn't set, which both actions treat as "no
          # passphrase" — safe either way.
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}"
            mkdir -p releases shared/uploads shared/backups incoming
            if [ ! -f shared/.env ]; then
              echo "shared/.env is missing — first-time setup isn't finished." >&2
              echo "See DEPLOYMENT.md 'First-time setup' before the first deploy." >&2
              exit 1
            fi

      # The release file reaches the host by the host *downloading* the CI
      # artifact itself, not by the runner pushing it over scp: on this cPanel
      # host (jailshell) the scp session was closed immediately ("remote
      # command exited without exit status") while ordinary SSH commands work.
      # Only read access is needed (`actions: read`); the short-lived
      # GITHUB_TOKEN is sent to api.github.com, which redirects to a signed
      # download URL (curl does not forward the token to that other host).
      # See docs/decisions/0041-deploy-host-fetches-release.md.
      - name: Find the release artifact built by ci.yml
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ needs.find-ci-run.outputs.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="release-${{ inputs.sha }}" and .expired==false) | .id')
          if [ -z "$id" ]; then
            echo "No unexpired artifact release-${{ inputs.sha }} on that ci run (artifacts expire after 14 days) — re-run ci for this commit." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Fetch the release on the host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # see the first step's comment
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}/incoming"
            rm -f artifact.zip release.tar.gz
            curl -fL --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -o artifact.zip \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.artifact.outputs.id }}/zip"
            unzip -o artifact.zip release.tar.gz
            rm -f artifact.zip
            # Fail here, not mid-unpack, if the download was cut short.
            gzip -t release.tar.gz

      # command_timeout defaults to 10m in appleboy/ssh-action, which the
      # first real deploy hit: the release artifact includes a full
      # production node_modules (hundreds of MB, tens of thousands of
      # small files — output: "standalone" is deliberately not used, see
      # ARCHITECTURE.md), and extracting that many small files is slow on
      # this host's I/O even though it isn't short on RAM (confirmed via
      # `free -h`: 124GB total, 42GB available at the time of the
      # failure) — drone-ssh killed the remote tar at the 10-minute mark
      # mid-extraction (1.1GB already unpacked from a 316MB archive, so
      # it was making real progress, just not fast enough). See
      # docs/decisions/0034-deploy-ssh-command-timeout.md.
      - name: Unpack the release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # see the first step's comment
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}"
            RELEASE_DIR="releases/${{ inputs.sha }}"
            # A re-run starts clean: a previous attempt killed mid-unpack
            # would otherwise leave stale or truncated files behind.
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "incoming/release.tar.gz" -C "$RELEASE_DIR"
            rm -f "incoming/release.tar.gz"

      # Everything past this point — shared-dir symlinks, DB backup,
      # migrations, syncing into the live directory, the restart, the
      # smoke test, and the automatic rollback on failure — lives in
      # scripts/deploy/deploy-release.sh (shipped inside the release
      # itself), so it's version-controlled and testable outside CI.
      # `current` is a real directory synced via rsync on every deploy,
      # not a symlink repointed per deploy — see ADR 0035.
      - name: Migrate, switch, restart, smoke-test (auto-rollback on failure)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # see the first step's comment
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 30m # see "Unpack the release" step's comment
          script_stop: true
          envs: SHA,APP_PATH,HEALTH_CHECK_URL
          script: |
            set -euo pipefail
            export SHA="${{ inputs.sha }}"
            export APP_PATH="${{ secrets.APP_PATH }}"
            export HEALTH_CHECK_URL="${{ secrets.HEALTH_CHECK_URL }}"
            bash "$APP_PATH/releases/$SHA/scripts/deploy/deploy-release.sh"
